<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.55" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#e0fbff" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="right" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.14"/>
    </linearGradient>
  </defs>
  <!-- 圆角底板 -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#glow)"/>
  <!-- 玻璃方块：上、左、右三个面 -->
  <g stroke="#ffffff" stroke-opacity="0.9" stroke-width="14" stroke-linejoin="round">
    <path d="M512 214 L770 363 L512 512 L254 363 Z" fill="url(#top)"/>
    <path d="M254 363 L512 512 L512 810 L254 661 Z" fill="url(#left)"/>
    <path d="M770 363 L770 661 L512 810 L512 512 Z" fill="url(#right)"/>
  </g>
  <!-- 高光 -->
  <path d="M300 405 L300 560" stroke="#ffffff" stroke-opacity="0.85" stroke-width="22" stroke-linecap="round"/>
  <circle cx="610" cy="300" r="20" fill="#ffffff" fill-opacity="0.9"/>
</svg>
