name: 功能建议
description: 建议新功能或改进现有功能
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 现在遇到了什么不方便的地方
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 希望的做法
      description: 你希望启动器怎么做
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案或参考
      description: 其他启动器的类似功能、截图等
