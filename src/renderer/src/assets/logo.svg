<!--
  琉璃启动器图标：看板娘头像（橙色长发、琥珀色眼睛、头顶橙花配黑丝带、白色荷叶边高领、黑领结配橙花胸针）。
  这是图标的源文件：build/icon.png（1024×1024，安装包与任务栏图标）、resources/icon.png（512×512，窗口图标）
  由它渲染生成；启动器左上角的标志直接使用同样内容的 src/renderer/src/assets/logo.svg
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="tile">
      <rect x="24" y="24" width="976" height="976" rx="228"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8ef"/>
      <stop offset="1" stop-color="#ffe2c6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a45"/>
      <stop offset="0.55" stop-color="#f4732a"/>
      <stop offset="1" stop-color="#dc561c"/>
    </linearGradient>
    <linearGradient id="hairBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8621f"/>
      <stop offset="1" stop-color="#c2471a"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffeadd"/>
      <stop offset="1" stop-color="#fff3ea"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e2c0e"/>
      <stop offset="0.45" stop-color="#b8571a"/>
      <stop offset="1" stop-color="#f6ad55"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1e6da"/>
    </linearGradient>
    <radialGradient id="petal" cx="0.5" cy="0.9" r="0.9">
      <stop offset="0" stop-color="#ffb35c"/>
      <stop offset="1" stop-color="#f26a1b"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#tile)">
    <!-- 底板 -->
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <circle cx="512" cy="430" r="430" fill="url(#glow)"/>
    <!-- 底板上的淡淡花纹 -->
    <g fill="#ffb37a" opacity="0.22">
      <circle cx="150" cy="180" r="10"/><circle cx="880" cy="150" r="8"/><circle cx="905" cy="620" r="12"/>
      <circle cx="110" cy="560" r="8"/><circle cx="200" cy="300" r="5"/><circle cx="840" cy="360" r="5"/>
    </g>

    <g transform="translate(512 560) scale(1.07) translate(-512 -560)">
    <!-- 后面的长发 -->
    <path d="M512 128 C318 128 206 262 214 448 C220 610 182 800 150 1024 L874 1024 C842 800 804 610 810 448 C818 262 706 128 512 128 Z"
          fill="url(#hairBack)" stroke="#4a2414" stroke-width="7" stroke-linejoin="round"/>
    <!-- 后发里的暗色发丝 -->
    <g fill="none" stroke="#a83c14" stroke-width="7" stroke-linecap="round" opacity="0.55">
      <path d="M262 520 C250 680 232 840 214 1000"/>
      <path d="M762 520 C774 680 792 840 810 1000"/>
    </g>

    <!-- 身体：白色衬衫 -->
    <path d="M244 1080 C252 824 330 744 430 716 L594 716 C694 744 772 824 780 1080 Z"
          fill="url(#cloth)" stroke="#4a2414" stroke-width="7" stroke-linejoin="round"/>
    <!-- 衬衫上的褶皱线 -->
    <g fill="none" stroke="#d9c6b4" stroke-width="5" stroke-linecap="round">
      <path d="M392 804 C388 880 384 960 382 1040"/>
      <path d="M632 804 C636 880 640 960 642 1040"/>
    </g>

    <!-- 脖子 -->
    <path d="M468 600 L468 720 L556 720 L556 600 Z" fill="#f6d3bf" stroke="#4a2414" stroke-width="7"/>
    <path d="M468 650 Q512 690 556 650 L556 600 L468 600 Z" fill="#ecbfa6"/>

    <!-- 荷叶边高领 -->
    <path d="M420 644 Q440 620 462 644 Q484 620 506 644 Q528 620 550 644 Q572 620 594 644 Q616 634 612 668
             L606 730 Q512 756 418 730 L412 668 Q408 634 420 644 Z"
          fill="url(#cloth)" stroke="#4a2414" stroke-width="7" stroke-linejoin="round"/>
    <path d="M430 696 Q512 716 594 696" fill="none" stroke="#dccbbb" stroke-width="5" stroke-linecap="round"/>

    <!-- 黑色领结 + 垂下的丝带 -->
    <g stroke="#120c10" stroke-width="5" stroke-linejoin="round">
      <path d="M498 744 L470 874 L500 856 L512 884 Z" fill="#231b22"/>
      <path d="M526 744 L554 874 L524 856 L512 884 Z" fill="#231b22"/>
      <path d="M512 734 L430 694 Q410 734 430 774 Z" fill="#2c232b"/>
      <path d="M512 734 L594 694 Q614 734 594 774 Z" fill="#2c232b"/>
    </g>
    <path d="M440 716 Q450 734 440 752" fill="none" stroke="#5a4a58" stroke-width="5" stroke-linecap="round"/>
    <path d="M584 716 Q574 734 584 752" fill="none" stroke="#5a4a58" stroke-width="5" stroke-linecap="round"/>
    <!-- 橙色花朵胸针 -->
    <g transform="translate(512 736)">
      <g fill="url(#petal)" stroke="#a8401a" stroke-width="3">
        <ellipse cx="0" cy="-22" rx="11" ry="20"/>
        <ellipse cx="0" cy="-22" rx="11" ry="20" transform="rotate(45)"/>
        <ellipse cx="0" cy="-22" rx="11" ry="20" transform="rotate(90)"/>
        <ellipse cx="0" cy="-22" rx="11" ry="20" transform="rotate(135)"/>
        <ellipse cx="0" cy="-22" rx="11" ry="20" transform="rotate(180)"/>
        <ellipse cx="0" cy="-22" rx="11" ry="20" transform="rotate(225)"/>
        <ellipse cx="0" cy="-22" rx="11" ry="20" transform="rotate(270)"/>
        <ellipse cx="0" cy="-22" rx="11" ry="20" transform="rotate(315)"/>
      </g>
      <circle r="13" fill="#c2410c" stroke="#7a2a0a" stroke-width="3"/>
      <circle cx="-4" cy="-4" r="4" fill="#ffd6a0"/>
    </g>

    <!-- 脸 -->
    <path d="M330 350 C322 470 352 566 440 624 Q512 668 584 624 C672 566 702 470 694 350 C684 236 340 236 330 350 Z"
          fill="url(#skin)" stroke="#4a2414" stroke-width="7" stroke-linejoin="round"/>
    <!-- 头发在额头上的阴影 -->
    <path d="M336 380 C380 430 460 420 512 404 C564 420 644 430 688 380 L690 330 L334 330 Z" fill="#f7d6c4"/>

    <!-- 腮红 -->
    <ellipse cx="402" cy="556" rx="40" ry="16" fill="#ff8f7a" opacity="0.32"/>
    <ellipse cx="622" cy="556" rx="40" ry="16" fill="#ff8f7a" opacity="0.32"/>

    <!-- 眼睛（左） -->
    <g>
      <path d="M380 474 Q428 448 480 464 Q486 524 436 538 Q388 532 380 474 Z" fill="#ffffff"/>
      <clipPath id="eyeL"><path d="M380 474 Q428 448 480 464 Q486 524 436 538 Q388 532 380 474 Z"/></clipPath>
      <g clip-path="url(#eyeL)">
        <ellipse cx="434" cy="500" rx="38" ry="46" fill="url(#iris)"/>
        <ellipse cx="436" cy="494" rx="16" ry="21" fill="#4a1c08"/>
        <path d="M380 474 Q428 448 480 464 L480 482 Q428 466 380 490 Z" fill="#8a3a14" opacity="0.55"/>
      </g>
      <ellipse cx="420" cy="484" rx="10" ry="12" fill="#ffffff"/>
      <circle cx="452" cy="516" r="5" fill="#ffffff" opacity="0.9"/>
      <path d="M372 478 Q426 444 484 460 Q492 462 496 470" fill="none" stroke="#2e140a" stroke-width="11" stroke-linecap="round"/>
      <path d="M374 478 L360 492" stroke="#2e140a" stroke-width="7" stroke-linecap="round"/>
      <path d="M408 536 Q436 542 462 532" fill="none" stroke="#a0573a" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- 眼睛（右） -->
    <g>
      <path d="M644 474 Q596 448 544 464 Q538 524 588 538 Q636 532 644 474 Z" fill="#ffffff"/>
      <clipPath id="eyeR"><path d="M644 474 Q596 448 544 464 Q538 524 588 538 Q636 532 644 474 Z"/></clipPath>
      <g clip-path="url(#eyeR)">
        <ellipse cx="590" cy="500" rx="38" ry="46" fill="url(#iris)"/>
        <ellipse cx="588" cy="494" rx="16" ry="21" fill="#4a1c08"/>
        <path d="M644 474 Q596 448 544 464 L544 482 Q596 466 644 490 Z" fill="#8a3a14" opacity="0.55"/>
      </g>
      <ellipse cx="574" cy="484" rx="10" ry="12" fill="#ffffff"/>
      <circle cx="606" cy="516" r="5" fill="#ffffff" opacity="0.9"/>
      <path d="M652 478 Q598 444 540 460 Q532 462 528 470" fill="none" stroke="#2e140a" stroke-width="11" stroke-linecap="round"/>
      <path d="M650 478 L664 492" stroke="#2e140a" stroke-width="7" stroke-linecap="round"/>
      <path d="M616 536 Q588 542 562 532" fill="none" stroke="#a0573a" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- 眉毛 -->
    <path d="M392 424 Q430 410 470 418" fill="none" stroke="#c4561d" stroke-width="7" stroke-linecap="round"/>
    <path d="M632 424 Q594 410 554 418" fill="none" stroke="#c4561d" stroke-width="7" stroke-linecap="round"/>
    <!-- 鼻子、嘴 -->
    <path d="M512 560 L506 572" stroke="#d99a80" stroke-width="5" stroke-linecap="round"/>
    <path d="M494 604 Q512 612 530 604" fill="none" stroke="#b5483c" stroke-width="6" stroke-linecap="round"/>

    <!-- 刘海与两侧的鬓发 -->
    <path d="M300 430
             C286 250 396 166 512 166 C628 166 738 250 724 430
             Q716 500 702 566 Q700 470 680 404
             Q676 440 652 474 Q660 420 640 378
             Q628 420 600 452 Q612 400 590 366
             Q574 420 540 468 Q556 410 532 370
             Q510 430 470 474 Q492 414 470 374
             Q448 420 414 452 Q432 404 416 380
             Q394 430 362 470 Q378 420 360 398
             Q344 470 324 566 Q312 500 300 430 Z"
          fill="url(#hair)" stroke="#4a2414" stroke-width="7" stroke-linejoin="round"/>
    <!-- 垂在胸前的长发 -->
    <path d="M334 440 C318 560 304 700 282 820 C270 900 262 970 258 1024 L330 1024 C334 940 340 860 356 760 C366 690 362 560 352 470 Z"
          fill="url(#hair)" stroke="#4a2414" stroke-width="7" stroke-linejoin="round"/>
    <path d="M690 440 C706 560 720 700 742 820 C754 900 762 970 766 1024 L694 1024 C690 940 684 860 668 760 C658 690 662 560 672 470 Z"
          fill="url(#hair)" stroke="#4a2414" stroke-width="7" stroke-linejoin="round"/>
    <!-- 发丝的暗线 -->
    <g fill="none" stroke="#c94f18" stroke-width="5" stroke-linecap="round" opacity="0.8">
      <path d="M512 176 C500 250 498 320 486 440"/>
      <path d="M560 196 C566 260 562 320 556 420"/>
      <path d="M458 200 C446 260 440 330 430 420"/>
      <path d="M430 196 C410 260 404 320 414 372"/>
      <path d="M594 196 C614 260 620 320 612 372"/>
      <path d="M332 520 C324 640 312 760 296 900"/>
      <path d="M692 520 C700 640 712 760 728 900"/>
    </g>
    <!-- 头顶的光泽 -->
    <path d="M378 270 Q420 244 470 232" fill="none" stroke="#ffd2a1" stroke-width="15" stroke-linecap="round" opacity="0.9"/>
    <path d="M500 228 Q540 226 576 232" fill="none" stroke="#ffd2a1" stroke-width="15" stroke-linecap="round" opacity="0.9"/>
    <path d="M606 240 Q636 250 652 264" fill="none" stroke="#ffd2a1" stroke-width="12" stroke-linecap="round" opacity="0.8"/>

    <!-- 头顶右侧的橙色花朵发饰 + 黑丝带 -->
    <g stroke="#120c10" stroke-width="5" stroke-linejoin="round">
      <path d="M716 300 Q750 360 742 440 L720 430 Q726 370 700 318 Z" fill="#231b22"/>
      <path d="M736 296 Q790 340 800 420 L776 418 Q768 356 722 314 Z" fill="#2c232b"/>
    </g>
    <g transform="translate(712 262)">
      <g fill="url(#petal)" stroke="#a8401a" stroke-width="4">
        <ellipse cx="0" cy="-40" rx="17" ry="34"/>
        <ellipse cx="0" cy="-40" rx="17" ry="34" transform="rotate(30)"/>
        <ellipse cx="0" cy="-40" rx="17" ry="34" transform="rotate(60)"/>
        <ellipse cx="0" cy="-40" rx="17" ry="34" transform="rotate(90)"/>
        <ellipse cx="0" cy="-40" rx="17" ry="34" transform="rotate(120)"/>
        <ellipse cx="0" cy="-40" rx="17" ry="34" transform="rotate(150)"/>
        <ellipse cx="0" cy="-40" rx="17" ry="34" transform="rotate(180)"/>
        <ellipse cx="0" cy="-40" rx="17" ry="34" transform="rotate(210)"/>
        <ellipse cx="0" cy="-40" rx="17" ry="34" transform="rotate(240)"/>
        <ellipse cx="0" cy="-40" rx="17" ry="34" transform="rotate(270)"/>
        <ellipse cx="0" cy="-40" rx="17" ry="34" transform="rotate(300)"/>
        <ellipse cx="0" cy="-40" rx="17" ry="34" transform="rotate(330)"/>
      </g>
      <circle r="24" fill="#c2410c" stroke="#7a2a0a" stroke-width="4"/>
      <circle r="12" fill="#e2601a"/>
      <circle cx="-8" cy="-8" r="6" fill="#ffd6a0"/>
    </g>
    </g>
  </g>
</svg>
